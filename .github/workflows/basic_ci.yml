name: CI

on:
  pull_request:
    branches: [ "main" ]
  pull_request_target:
    types: [ closed ]
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target'

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run unit tests
        shell: pwsh
        env:
          TUNIT_GITHUB_REPORTER_STYLE: collapsible
        run: |
          ./automation/scripts/run-unit-tests.ps1 -TemplateType @('item', 'project', 'solution')

      - name: Detect TRX files
        if: always()
        id: trx
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Path artifacts/test-results -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if ($trxFiles) {
            "has_trx=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          else {
            "has_trx=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Publish TRX results
        if: always() && steps.trx.outputs.has_trx == 'true'
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: artifacts/test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          if-no-files-found: warn
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/*.html
            artifacts/test-results/**/*.json

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-test-report
          if-no-files-found: warn
          path: ${{ runner.temp }}/tunit-aggregate/**/merged-report.html

  update-changelog:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.base_ref == 'main'

    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract and update changelog
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pwsh -File "${{ github.workspace }}/automation/scripts/update-changelog-from-pr.ps1" -PrBody $env:PR_BODY -PrNumber $env:PR_NUMBER

      - name: Commit changelog updates
        run: |
          if [[ -n "$(git status --porcelain CHANGELOG.md)" ]]; then
            git add CHANGELOG.md
            git commit -m "docs: update CHANGELOG.md from PR #${{ github.event.pull_request.number }}"
            git push
          else
            echo "No changelog changes to commit"
          fi

