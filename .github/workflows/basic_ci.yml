name: CI

on:
  pull_request:
    branches: [ "main" ]
  pull_request_target:
    types: [ closed ]
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target'

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run unit tests
        shell: pwsh
        env:
          TUNIT_GITHUB_REPORTER_STYLE: collapsible
        run: |
          ./automation/scripts/run-unit-tests.ps1 -TemplateType @('item', 'project', 'solution')

      - name: Detect TRX files
        if: always()
        id: trx
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Path artifacts/test-results -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if ($trxFiles) {
            "has_trx=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          else {
            "has_trx=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Publish TRX results
        if: always() && steps.trx.outputs.has_trx == 'true'
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: artifacts/test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          if-no-files-found: warn
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/*.html
            artifacts/test-results/**/*.json

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-test-report
          if-no-files-found: warn
          path: ${{ runner.temp }}/tunit-aggregate/**/merged-report.html

